<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Infrastructure &amp; Scaling Walkthrough</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: 'Segoe UI', system-ui, sans-serif;
				background: #0f1117;
				color: #e2e8f0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 24px 16px 40px;
			}

			h1 {
				font-size: 1.3rem;
				font-weight: 600;
				color: #94a3b8;
				letter-spacing: 0.05em;
				margin-bottom: 18px;
				text-transform: uppercase;
				text-align: center;
			}

			/* Stage rail */
			.stages {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-bottom: 22px;
				justify-content: center;
			}
			.stage-chip {
				padding: 6px 16px;
				border-radius: 6px;
				border: 1px solid #334155;
				background: #1e293b;
				color: #94a3b8;
				cursor: pointer;
				font-size: 0.82rem;
				font-weight: 500;
				transition: all 0.2s;
			}
			.stage-chip:hover {
				border-color: #60a5fa;
				color: #e2e8f0;
			}
			.stage-chip.active {
				background: #1d4ed8;
				border-color: #3b82f6;
				color: #fff;
			}

			/* Deck */
			.deck {
				width: 100%;
				max-width: 1000px;
			}

			.stage {
				display: grid;
				grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
				gap: 16px;
				align-items: stretch;
			}
			.stage.full {
				grid-template-columns: 1fr;
			}
			.stage.full .diagram-wrap {
				display: none;
			}

			/* Wordless product-story slide */
			.stage.story {
				grid-template-columns: 1fr;
			}
			.stage.story .diagram-wrap {
				display: none;
			}
			.story-wrap {
				display: none;
			}
			.stage.story .story-wrap {
				display: grid;
				place-items: center;
				background: #1e293b;
				border: 1px solid #334155;
				border-radius: 12px;
				padding: 30px 22px;
				min-height: 300px;
			}
			.stage.story .panel {
				background: transparent;
				border: none;
				text-align: center;
				padding: 4px 0 16px;
				max-width: 760px;
				margin: 0 auto;
				width: 100%;
			}
			#story-svg {
				width: 100%;
				height: auto;
				max-height: 330px;
			}

			.diagram-wrap {
				background: #1e293b;
				border: 1px solid #334155;
				border-radius: 12px;
				padding: 14px;
				display: grid;
				height: 560px;
				align-self: start;
				overflow: hidden;
			}
			svg {
				display: block;
				width: 100%;
				height: 100%;
			}

			/* Content panel */
			.panel {
				background: #0f172a;
				border: 1px solid #334155;
				border-radius: 12px;
				padding: 22px 24px;
				display: flex;
				flex-direction: column;
			}
			.full .panel {
				max-width: 760px;
				margin: 0 auto;
				width: 100%;
			}

			/* Scale-intro (framing question) panel — blue */
			.panel.intro {
				justify-content: center;
				border-color: rgba(59, 130, 246, 0.4);
				background: #0b1220;
			}
			.panel.intro .kicker {
				color: #60a5fa;
			}
			.panel.intro h2 {
				font-size: 1.6rem;
				line-height: 1.22;
			}

			/* Problem question panel — amber */
			.panel.q {
				justify-content: center;
				border-color: rgba(251, 191, 36, 0.4);
				background: #14120b;
			}
			.panel.q .kicker {
				color: #fbbf24;
			}
			.panel.q h2 {
				font-size: 1.7rem;
				line-height: 1.2;
			}

			.kicker {
				font-size: 0.72rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				color: #60a5fa;
				text-transform: uppercase;
				margin-bottom: 8px;
			}
			.panel h2 {
				font-size: 1.35rem;
				font-weight: 600;
				color: #f1f5f9;
				line-height: 1.25;
				margin-bottom: 6px;
			}
			.panel .sub {
				font-size: 0.9rem;
				color: #64748b;
				margin-bottom: 14px;
			}
			.credit {
				margin-top: 18px;
				font-size: 0.8rem;
				color: #64748b;
				line-height: 1.5;
			}
			.credit a {
				color: #60a5fa;
				text-decoration: none;
			}
			.credit a:hover {
				text-decoration: underline;
			}

			/* Four-services grid */
			.svc-grid {
				margin-top: 16px;
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 12px;
				text-align: left;
			}
			.svc {
				background: #111a2e;
				border: 1px solid #334155;
				border-left-width: 3px;
				border-radius: 8px;
				padding: 13px 15px;
				font-size: 0.88rem;
				line-height: 1.5;
				color: #94a3b8;
			}
			.svc b {
				color: #cbd5e1;
			}
			.svc code {
				font-size: 0.82em;
				background: rgba(148, 163, 184, 0.12);
				padding: 1px 5px;
				border-radius: 4px;
				color: #cbd5e1;
			}
			.svc-c {
				border-left-color: #60a5fa;
			}
			.svc-d {
				border-left-color: #a78bfa;
			}
			.svc-h {
				font-size: 1rem;
				font-weight: 700;
				color: #f1f5f9;
				margin-bottom: 5px;
			}
			.svc-note {
				margin-top: 13px;
				font-size: 0.82rem;
				color: #64748b;
				line-height: 1.5;
				text-align: left;
			}
			@media (max-width: 620px) {
				.svc-grid {
					grid-template-columns: 1fr;
				}
			}

			.points {
				list-style: none;
				margin-top: 4px;
			}
			.points li {
				font-size: 0.92rem;
				line-height: 1.5;
				color: #cbd5e1;
				padding: 5px 0 5px 20px;
				position: relative;
			}
			.points li::before {
				content: '';
				position: absolute;
				left: 4px;
				top: 12px;
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: #475569;
			}
			.panel.intro .points li::before {
				background: #2563eb;
			}
			.panel.q .points li::before {
				background: #b45309;
			}
			.points li b {
				color: #e2e8f0;
			}
			.points li .hi {
				color: #60a5fa;
				font-weight: 600;
			}
			.points li .hi-p {
				color: #a78bfa;
				font-weight: 600;
			}

			/* Comparison / callout blocks */
			.compare {
				margin-top: 14px;
				border-collapse: collapse;
				width: 100%;
				font-size: 0.78rem;
			}
			.compare th {
				text-align: left;
				padding: 6px 8px;
				color: #94a3b8;
				font-weight: 700;
				border-bottom: 1px solid #334155;
				text-transform: uppercase;
				font-size: 0.68rem;
				letter-spacing: 0.04em;
			}
			.compare td {
				padding: 6px 8px;
				color: #94a3b8;
				border-bottom: 1px solid #1e293b;
				vertical-align: top;
			}
			.compare td b {
				color: #cbd5e1;
			}

			.callout {
				margin-top: 14px;
				display: grid;
				gap: 8px;
			}
			.card {
				background: #111a2e;
				border: 1px solid #334155;
				border-radius: 8px;
				padding: 10px 12px;
				font-size: 0.85rem;
				line-height: 1.45;
				color: #cbd5e1;
			}
			.card .tag {
				display: inline-block;
				font-size: 0.68rem;
				font-weight: 700;
				letter-spacing: 0.05em;
				padding: 1px 7px;
				border-radius: 4px;
				margin-right: 6px;
				text-transform: uppercase;
			}
			.tag-warn {
				background: rgba(251, 191, 36, 0.15);
				color: #fbbf24;
			}
			.tag-ok {
				background: rgba(34, 197, 94, 0.15);
				color: #4ade80;
			}
			.tag-tr {
				background: rgba(148, 163, 184, 0.15);
				color: #cbd5e1;
			}

			/* SVG node/edge visibility system */
			.node,
			.edge,
			.edge-label {
				opacity: 0;
				transition: opacity 0.5s ease;
			}
			.node.vis,
			.edge.vis,
			.edge-label.vis {
				opacity: 1;
			}

			.box {
				fill: #1e293b;
				stroke: #475569;
				stroke-width: 1.6;
			}
			.n-label {
				font-size: 11px;
				fill: #e2e8f0;
				text-anchor: middle;
				dominant-baseline: central;
				font-weight: 600;
				pointer-events: none;
			}
			.n-sub {
				font-size: 7px;
				fill: #e2e8f0;
				text-anchor: middle;
				dominant-baseline: central;
				pointer-events: none;
			}

			.cat-net .box {
				stroke: #3b82f6;
			}
			.cat-compute .box {
				stroke: #60a5fa;
			}
			.cat-data .box {
				stroke: #a78bfa;
			}

			.zone {
				fill: rgba(148, 163, 184, 0.03);
				stroke: #475569;
				stroke-width: 1.2;
				stroke-dasharray: 5, 3;
			}
			.zone-region {
				fill: rgba(59, 130, 246, 0.04);
				stroke: #3b82f6;
				stroke-dasharray: 6, 4;
			}
			.zone-shadow {
				fill: rgba(148, 163, 184, 0.02);
			}
			.zone-label {
				font-size: 8.5px;
				fill: #64748b;
				font-weight: 600;
				letter-spacing: 0.04em;
			}
			.zone-region .zone-label {
				fill: #60a5fa;
			}

			.edge {
				stroke: #334155;
				stroke-width: 1.8;
				fill: none;
			}
			.edge.dashed {
				stroke-dasharray: 4, 3;
			}
			.edge-label {
				font-size: 8px;
				fill: #94a3b8;
				text-anchor: middle;
			}

			/* "just added" glow */
			.node.new .box {
				stroke: #fbbf24;
				filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.55));
			}
			.edge.new {
				stroke: #fbbf24;
				stroke-width: 2.2;
			}

			/* "this is the problem" highlight (on question slides) */
			.node.problem .box,
			.node.problem .zone {
				stroke: #f87171 !important;
				filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.6));
			}
			.node.problem .n-label {
				fill: #fecaca;
			}

			/* Controls */
			.controls {
				display: flex;
				align-items: center;
				gap: 16px;
				margin-top: 22px;
				justify-content: center;
			}
			.btn {
				padding: 8px 24px;
				border-radius: 6px;
				border: 1px solid #334155;
				background: #1e293b;
				color: #e2e8f0;
				cursor: pointer;
				font-size: 0.9rem;
				font-weight: 500;
				transition: all 0.2s;
			}
			.btn:hover:not(:disabled) {
				border-color: #60a5fa;
				background: #263348;
			}
			.btn:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}
			.step-counter {
				font-size: 0.85rem;
				color: #64748b;
				min-width: 90px;
				text-align: center;
			}

			@media (max-width: 780px) {
				.stage {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<h1>Scaling an image server to the moon</h1>

		<div class="stages" id="stages"></div>

		<div class="deck">
			<div class="stage" id="stage">
				<div class="diagram-wrap">
					<svg
						id="svg"
						viewBox="205 8 270 468"
						preserveAspectRatio="xMidYMid meet"
					>
						<defs>
							<marker
								id="m-arrow"
								viewBox="0 0 10 10"
								refX="8"
								refY="5"
								markerWidth="6"
								markerHeight="6"
								orient="auto"
							>
								<path d="M0,1 L9,5 L0,9 z" fill="#64748b" />
							</marker>
						</defs>

						<!-- ===================== ZONES (drawn first) ===================== -->
						<g class="node zone-grp" data-since="multi-region">
							<rect
								class="zone zone-region"
								x="205"
								y="176"
								width="250"
								height="300"
								rx="10"
							/>
							<text class="zone-label" x="215" y="192">
								REGION A · us-east-1
							</text>
						</g>
						<g class="node zone-grp" data-since="multi-region">
							<rect
								class="zone zone-region"
								x="560"
								y="176"
								width="250"
								height="300"
								rx="10"
							/>
							<text class="zone-label" x="570" y="192">
								REGION B · us-west-2
							</text>
						</g>

						<g class="node" id="aza-group" data-since="small" data-until="az-problem">
							<rect
								class="zone"
								x="180"
								y="158"
								width="280"
								height="188"
								rx="8"
							/>
							<text class="zone-label" x="190" y="176">AZ-a</text>
						</g>

						<!-- AZ wrapping the monolith EC2 (local disk now lives inside it); S3 sits below, outside -->
						<g class="node" data-since="verysmall" data-until="small-q">
							<rect
								class="zone"
								x="194"
								y="82"
								width="252"
								height="248"
								rx="8"
							/>
							<text class="zone-label" x="202" y="99">AZ-a</text>
						</g>

						<!-- ===================== EDGES ===================== -->
						<line
							class="edge"
							data-since="local"
							data-until="verysmall-q"
							x1="320"
							y1="56"
							x2="320"
							y2="200"
						/>
						<line
							class="edge"
							data-since="small"
							data-until="az-problem"
							x1="320"
							y1="56"
							x2="320"
							y2="158"
						/>
						<line
							class="edge"
							data-since="ha"
							data-until="efs-problem"
							x1="320"
							y1="56"
							x2="320"
							y2="128"
						/>
						<line
							class="edge"
							data-since="multi-region"
							x1="320"
							y1="56"
							x2="320"
							y2="76"
						/>
						<line
							class="edge"
							data-since="multi-region"
							x1="320"
							y1="106"
							x2="320"
							y2="128"
						/>
						<line
							class="edge"
							data-since="ha"
							data-until="efs-problem"
							x1="320"
							y1="160"
							x2="233"
							y2="200"
						/>
						<line
							class="edge"
							data-since="ha"
							data-until="efs-problem"
							x1="320"
							y1="160"
							x2="407"
							y2="200"
						/>
						<line
							class="edge"
							data-since="multi-region"
							x1="320"
							y1="160"
							x2="270"
							y2="202"
						/>
						<line
							class="edge"
							data-since="multi-region"
							x1="320"
							y1="160"
							x2="394"
							y2="202"
						/>
						<line
							class="edge"
							data-since="metadata-fix"
							x1="342"
							y1="270"
							x2="392"
							y2="406"
							marker-end="url(#m-arrow)"
						/>
						<line
							class="edge"
							data-since="small"
							x1="300"
							y1="270"
							x2="282"
							y2="406"
							marker-end="url(#m-arrow)"
						/>
						<!-- slides 6-7: Users → AZ-wrapped monolith, and Storage → S3 (routed left of the local disk) -->
						<line
							class="edge"
							data-since="verysmall"
							data-until="small-q"
							x1="320"
							y1="56"
							x2="320"
							y2="104"
						/>
						<line
							class="edge"
							data-since="verysmall"
							data-until="small-q"
							x1="250"
							y1="222"
							x2="262"
							y2="372"
							marker-end="url(#m-arrow)"
						/>
						<line
							class="edge"
							data-since="large"
							x1="320"
							y1="302"
							x2="320"
							y2="322"
						/>
						<line
							class="edge"
							data-since="large"
							x1="352"
							y1="352"
							x2="388"
							y2="368"
						/>
						<line
							class="edge"
							data-since="large"
							x1="292"
							y1="352"
							x2="282"
							y2="368"
						/>
						<!-- CloudFront -->
						<line
							class="edge dashed"
							data-since="large"
							x1="252"
							y1="42"
							x2="172"
							y2="82"
						/>
						<line
							class="edge dashed"
							data-since="large"
							x1="105"
							y1="114"
							x2="228"
							y2="416"
						/>
						<!-- Cross-region -->
						<line
							class="edge dashed"
							data-since="multi-region"
							x1="320"
							y1="106"
							x2="608"
							y2="234"
						/>
						<line
							class="edge"
							data-since="multi-region"
							x1="452"
							y1="430"
							x2="688"
							y2="430"
						/>
						<line
							class="edge"
							data-since="multi-region"
							x1="326"
							y1="438"
							x2="583"
							y2="438"
						/>
						<text class="edge-label" data-since="multi-region" x="570" y="424">
							global tables (active-active)
						</text>
						<text class="edge-label" data-since="multi-region" x="455" y="452">
							S3 CRR
						</text>

						<!-- ===================== NODES ===================== -->
						<!-- Users -->
						<g class="node cat-net" data-since="local">
							<rect
								class="box"
								x="250"
								y="24"
								width="140"
								height="32"
								rx="16"
							/>
							<text class="n-label" x="320" y="40">Users</text>
						</g>

						<!-- Geo-routing -->
						<g class="node cat-net" data-since="multi-region">
							<rect class="box" x="245" y="76" width="150" height="30" rx="6" />
							<text class="n-label" x="320" y="91">Geo-routing</text>
						</g>

						<!-- CloudFront -->
						<g class="node cat-net" data-since="large">
							<rect class="box" x="40" y="72" width="132" height="42" rx="6" />
							<text class="n-label" x="106" y="88">CloudFront</text>
							<text class="n-sub" x="106" y="102">edge cache</text>
						</g>

						<!-- ALB -->
						<g class="node cat-net" data-since="ha">
							<rect
								class="box"
								x="255"
								y="128"
								width="130"
								height="32"
								rx="6"
							/>
							<text class="n-label" x="320" y="144">ALB</text>
						</g>

						<!-- Monolith — request services (top) feeding storage/metadata handlers (bottom). Slides 4-5 (local stage); slides 6-7 use the AZ-wrapped copy below. -->
						<g class="node cat-compute" data-since="local" data-until="verysmall-q">
							<rect
								class="box"
								x="208"
								y="146"
								width="224"
								height="216"
								rx="8"
							/>
							<text class="n-label" x="320" y="163" font-size="10">EC2</text>
							<!-- services row -->
							<rect class="box" x="224" y="174" width="60" height="32" rx="5" />
							<text class="n-label" x="254" y="191" font-size="9">Upload</text>
							<rect class="box" x="290" y="174" width="60" height="32" rx="5" />
							<text class="n-label" x="320" y="191" font-size="9">
								Download
							</text>
							<rect class="box" x="356" y="174" width="60" height="32" rx="5" />

		<script>
			// ─── Slide content ──────────────────────────────────────────────────────────
			const SLIDES = [
				{
					id: 'title',
					full: true,
					kicker: 'System design',
					title: 'Design a planet-scale image-serving system',
					credit:
						'Adapted from Google SRE Classroom · <a href="https://sre.google/classroom/imageserver/" target="_blank" rel="noopener">Distributed ImageServer</a>',
				},
				{
					id: 'product',
					story: true,
					kicker: 'The product',
					title: 'What we’re building',
				},
				{
					id: 'features',
					full: true,
					kicker: 'The product · Features',
					title: 'What do we need',
					extra:
						'<div class="svc-grid">' +
						'<div class="svc svc-c"><div class="svc-h">Upload</div>Takes a photo in and writes it to storage.</div>' +
						'<div class="svc svc-c"><div class="svc-h">Download</div>Serves stored photos back out to viewers.</div>' +
						'<div class="svc svc-c"><div class="svc-h">Search</div>Finds images by keyword or tag.</div>' +
						'<div class="svc svc-d"><div class="svc-h">Metadata</div>Maps each <code>image_id</code> → its tags, owner, and where the file lives.</div>' +
						'</div>',
				},
				{
					id: 'storages',
					full: true,
					kicker: 'The product · Storages',
					title: 'What we will go through',
					extra:
						'<div class="svc-grid">' +
						'<div class="svc svc-c"><div class="svc-h">Elastic Block Storage (EBS)</div>Raw disk space which OS will format and use, like plugging in hard disk</div>' +
						'<div class="svc svc-c"><div class="svc-h">Elastic File System (EFS)</div>Network file storage organizes data into files and folders you can browse, like a shared network drive that multiple machines can mount.</div>' +
						'<div class="svc svc-c"><div class="svc-h">S3</div>Object storage that can be globally accessible.</div>' +
						'</div>',
				},
				{
					id: 'local-intro',
					intro: true,
					full: true,
					kicker: '▲ Scaling up · 1–10 users',
					title: 'Starting from scratch',
					points: [
						'What’s the <b>simplest thing</b> we can build that serves images end-to-end?',
					],
				},
				{
					id: 'local',
					kicker: 'Stage 1 · 1–10 users',
					title: 'Local — a single monolith',
					points: [
						'One server handles <b>everything</b>: upload, download, search, and metadata.',
						'Everything reads / writes to <b>local disk</b>.',
						'Request flow is straightforward: <span class="hi">user → server → storage</span>, all on one machine.',
					],
				},
				{
					id: 'verysmall-q',
					intro: true,
					kicker: '▲ Scaling up · 100 users',
					title: 'What is the first thing that could break?',
					points: [],
				},
				{
					id: 'verysmall',
					kicker: 'Stage 2 · 100 users · 1 region',
					title: 'Split out the storage layer',
					points: [
						'As storage grows, move photo storage to an <b>external service</b>.',
						'<span class="hi-p">S3</span> object storage fits well — metadata maps each key to a photo.',
						'Metadata is still small enough to <b>stay on local disk</b>.',
					],
					extra:
						'<table class="compare"><tr><th>Type</th><th>What it is</th><th>Reach</th></tr>' +
						'<tr><td><b>EBS</b></td><td>Network block storage — raw disk your OS formats. One instance at a time*.</td><td>Single AZ</td></tr>' +
						'<tr><td><b>EFS</b></td><td>Network file system — many instances mount it at once, like a shared drive.</td><td>Single region</td></tr>' +
						'<tr><td><b>S3</b></td><td>Object storage — each file has an id. Best fit for large files like photos.</td><td>Global</td></tr></table>',
				},
				{
					id: 'small-q',
					intro: true,
					kicker: '▲ Scaling up · 10,000 users',
					title: '100× the traffic hits one server. What could go wrong?',
					points: [
						'People search for photos far more often than they upload or download — Read ≫ writes',
						'Users expect low latency for search, but uploads and downloads are more resource-intensive.',
						'Uploads require long-lived network connections and consume significant RAM and bandwidth.',
						'Downloads require CPU to compress data from storage before sending it to the client.',
					],
				},
				{
					id: 'small',
					kicker: 'Stage 3 · 10,000 users · 1 region',
					title: 'Break the monolith into services',
					points: [
						'Reads ≫ writes: people <b>search</b> far more than they upload or download.',
						'Split into four services: <b>Search, Metadata, Upload, Download</b>.',
						'Replicate Search + Metadata — <span class="hi">replicating for performance</span>.',
						'Upload / Download stay single replica (RAM, bandwidth & CPU heavy).',
					],
				},
				{
					id: 'az-problem',
					q: true,
					kicker: '🚨 The problem',
					title: 'What happens when an AZ goes down?',
					points: [
						'Right now every replica lives in a <b>single Availability Zone</b>.',
						'If that one AZ fails, the <b>whole service goes down with it</b>.',
					],
				},
				{
					id: 'ha',
					kicker: 'Stage 3 · high availability',
					title: 'Provision across two AZs',
					points: [
						'Add replicas in a <b>second AZ</b> — <span class="hi">replicating for high availability</span>.',
						'When one AZ fails, load <b>fails over</b> to the other.',
						'AWS: minimum 2 AZs, best practice 3 (quorum-based).',
						'Add an <b>ALB</b> in front to distribute traffic.',
					],
					extra:
						'<div class="callout"><div class="card"><span class="tag tag-tr">Look-alike, different goal</span>Replicating for performance and for HA produce the same picture — but one chases latency, the other chases uptime.</div></div>',
				},
				{
					id: 'metadata-problem',
					q: true,
					kicker: '🚨 The problem',
					title: 'Metadata lives in a local file',
					points: [
						'Each server keeps metadata on its <b>own local disk</b>.',
						'A local file <b>can’t simply be replicated</b> across servers — so how do we share it?',
					],
				},
				{
					id: 'metadata-fix',
					kicker: 'Stage 3 · solving metadata',
					title: 'Two ways to share the metadata',
					extra:
						'<div class="callout">' +
						'<div class="card"><span class="tag tag-ok">Solution 1</span>Central store on <b>EFS</b> (network file system). <span class="tag tag-warn" style="margin-left:0">Trade-off</span> reads ~1–3ms vs ~0.1ms local; no clean fix without dropping files entirely.</div>' +
						'<div class="card"><span class="tag tag-ok">Solution 2</span><b>Shard</b> the metadata — each server holds a subset (directory / hash / consistent hashing). <span class="tag tag-warn" style="margin-left:0">Trade-off</span> ops complexity; adding a server means rebalancing.</div>' +
						'</div>',
				},

				{
					id: 'global-q',
					intro: true,
					kicker: '▲ Scaling up · 50k–100k users · going global',
					title: 'Your users are now worldwide. How do you cut their latency?',
					points: [
						'A request from Asia still crosses the ocean to a <b>single region</b>. What would you change?',
					],
				},
				{
					id: 'efs-problem',
					q: true,
					kicker: '🚨 The problem',
					title: 'EFS is region-bound',
					points: [
						'Our metadata now lives on <b>EFS</b> — but EFS <b>can’t cross regions</b>.',
						'As we expand to a second region, <b>how do we serve metadata there?</b>',
					],
				},
				{
					id: 'multi-region',
					kicker: 'Stage 4 · 50k–100k users · 2 regions',
					title: 'Go multi-region',
					points: [
						'Deploy closer to users with <b>geolocation-based routing</b>.',
						'✅ S3 <b>cross-region replication</b> works out of the box.',
						'Migrate metadata to <span class="hi-p">DynamoDB global tables</span> — active-active; reads & writes stay <b>local</b>.',
						'Enable <b>autoscaling</b> — up on load, down when quiet.',
					],
				},

				{
					id: 'data-q',
					intro: true,
					kicker: '▲ Scaling up · 1,000,000++ users',
					title: 'Compute scales fine now. So what’s the new bottleneck?',
					points: [
						'Hint: it’s no longer about servers. Where does a <b>million users</b> create pressure?',
					],
				},
				{
					id: 'large',
					kicker: 'Stage 5 · 1,000,000++ global users',
					title: 'Scaling shifts from compute to data',
					points: [
						'Metadata cache: <span class="hi-p">ElastiCache</span> (Redis / Memcached), <code>image_id → metadata</code>.',
						'Image cache: <span class="hi">CloudFront</span> edge (S3 origin) → low latency globally.',
						'Cold, rarely-accessed data → <b>S3 tiering</b> keeps cost in check.',
					],
				},

				{
					id: 'takeaways',
					full: true,
					kicker: 'Wrap-up',
					title: 'Takeaways',
					points: [
						'<b>Replicating for performance vs HA</b> — they look the same but serve different goals.',
						'<b>Sharding</b> = partitioning data across instances — solves scale, adds routing complexity.',
						'Scaling <b>compute</b> is relatively easy; scaling <b>data</b> is where it gets hard.',
					],
					extra:
						'<div class="callout">' +
						'<div class="card"><span class="tag tag-warn">Trade-offs everywhere ⚖️</span>A user in another region won’t see a new photo instantly — <b>eventual consistency</b>. Older data loads slower.</div>' +
						'<div class="card"><span class="tag tag-ok">Room to optimize</span>Shift upload/download to <b>async queues</b> to free resources; generate <b>thumbnails lazily</b> on first request.</div>' +
						'</div>',
				},
			];

			// ─── Slide indexing ──────────────────────────────────────────────────────────
			// Everything below is keyed by a slide's STABLE STRING id (SLIDES[].id), never
			// by its numeric position. Add or delete a slide by editing the SLIDES array
			// only — indices are resolved at runtime from array order, so nothing here (or
			// in the SVG data-since/data-until attributes) needs renumbering.
			//   • ID[id]      → current numeric index of that slide
			//   • idx(id)     → same, tolerant of a raw number too
			// A map keyed by an id that no longer exists is simply ignored; a data-since/
			// data-until pointing at a missing id makes that element stay hidden (fail-safe).
			const ID = {};
			SLIDES.forEach((s, i) => {
				if (s.id) ID[s.id] = i;
			});
			const idx = (v) => (typeof v === 'number' ? v : ID[v]);

			// Stage rail: label → target slide id + active id range [first, last] inclusive
			const STAGES = [
				{ label: 'Local', s: 'local-intro', r: ['local-intro', 'local'] },
				{ label: 'Very small', s: 'verysmall-q', r: ['verysmall-q', 'verysmall'] },
				{ label: 'Small', s: 'small-q', r: ['small-q', 'metadata-fix'] },
				{ label: 'Medium', s: 'global-q', r: ['global-q', 'multi-region'] },
				{ label: 'Large', s: 'data-q', r: ['data-q', 'large'] },
				{ label: 'Takeaways', s: 'takeaways', r: ['takeaways', 'takeaways'] },
			];

			// Morphing metadata-store name, by slide id (only ms[0], the name, is read now)
			const MS = {
				local: ['Local Disk', 'photos + metadata'],
				'verysmall-q': ['Local Disk', 'photos + metadata'],
				verysmall: ['Local Disk', 'metadata'],
				'small-q': ['Local Disk', 'metadata'],
				small: ['Local Disk', 'metadata / server'],
				'az-problem': ['Local Disk', 'metadata / server'],
				ha: ['Local Disk', 'metadata'],
				'metadata-problem': ['Local Disk', 'metadata'],
				'metadata-fix': ['EFS', 'central metadata'],
				'global-q': ['EFS', 'central metadata'],
				'efs-problem': ['EFS', 'central metadata'],
				'multi-region': ['DynamoDB', 'global tables'],
				'data-q': ['DynamoDB', 'global tables'],
				large: ['DynamoDB', 'global tables'],
			};
			const S3SUB = { large: 'images · tiered' }; // currently unused (folders show it)

			// On these question slides, flag the node that IS the problem
			const PROBLEM = {
				'az-problem': 'aza-group',
				'metadata-problem': 'az-disks',
				'efs-problem': 'ms-group',
			};

			// Per-slide camera: zoom the viewBox to whatever the diagram is actually using,
			// so each state fills the canvas instead of sitting in one fixed wide frame.
			const VB_SINGLE = '205 8 270 468'; // one region — the left stack
			const VB_AZ2 = '178 12 284 468'; // single AZ wrapping monolith + local disk (slides 6-7)
			const VB_AZ = '172 8 296 468'; // enlarged single AZ
			const VB_HA = '140 8 360 468'; // HA — two AZs side by side
			const VB_MULTI = '185 8 645 468'; // two regions side by side
			const VB_LARGE = '25 8 805 468'; // + CloudFront out to the left
			const VIEWBOX = {
				verysmall: VB_AZ2,
				'small-q': VB_AZ2,
				small: VB_AZ,
				'az-problem': VB_AZ,
				ha: VB_HA,
				'metadata-problem': VB_HA,
				'metadata-fix': VB_HA,
				'global-q': VB_HA,
				'efs-problem': VB_HA,
				'multi-region': VB_MULTI,
				'data-q': VB_MULTI,
				large: VB_LARGE,
			};

			let cur = 0;

			// ─── Render stage rail ───────────────────────────────────────────────────────
			const stagesEl = document.getElementById('stages');
			STAGES.forEach((st, i) => {
				const b = document.createElement('button');
				b.className = 'stage-chip';
				b.textContent = st.label;
				b.onclick = () => {
					cur = idx(st.s);
					render();
				};
				b.dataset.idx = i;
				stagesEl.appendChild(b);
			});

			// ─── Diagram state by slide ──────────────────────────────────────────────────
			function renderDiagram(slide) {
				// `slide` is the numeric index; `id` is its stable id. SVG lifespans use
				// ids (data-since/data-until), resolved to indices via ID at render time.
				const id = SLIDES[slide].id;
				document
					.querySelectorAll('#svg .node, #svg .edge, #svg .edge-label')
					.forEach((el) => {
						const since = idx(el.dataset.since);
						const until =
							el.dataset.until !== undefined ? idx(el.dataset.until) : Infinity;
						const visible = slide >= since && slide <= until;
						el.classList.toggle('vis', visible);
						el.classList.toggle('new', visible && slide === since);
						el.classList.remove('problem');
					});
				// Morph metadata store name (images/metadata now shown as folders inside the boxes)
				const ms = MS[id];
				if (ms) {
					document.getElementById('ms-l').textContent = ms[0];
				}
				// Problem highlight
				if (PROBLEM[id]) {
					document.getElementById(PROBLEM[id]).classList.add('problem');
				}
				// Zoom the camera to this slide's active region
				document
					.getElementById('svg')
					.setAttribute('viewBox', VIEWBOX[id] || VB_SINGLE);
			}

			// ─── Render panel + everything ───────────────────────────────────────────────
			function render() {
				const s = SLIDES[cur];
				const stage = document.getElementById('stage');
				stage.classList.toggle('full', !!s.full);
				stage.classList.toggle('story', !!s.story);

				let html = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2>`;
				if (s.sub) html += `<div class="sub">${s.sub}</div>`;
				if (s.points) {
					html +=
						'<ul class="points">' +
						s.points.map((p) => `<li>${p}</li>`).join('') +
						'</ul>';
				}
				if (s.extra) html += s.extra;
				if (s.credit) html += `<div class="credit">${s.credit}</div>`;
				const panel = document.getElementById('panel');
				panel.className =
					'panel' + (s.q ? ' q' : '') + (s.intro ? ' intro' : '');
				panel.innerHTML = html;

				if (!s.full) renderDiagram(cur);

				// Stage rail active state
				document.querySelectorAll('.stage-chip').forEach((c, i) => {
					const st = STAGES[i];
					c.classList.toggle(
						'active',
						cur >= idx(st.r[0]) && cur <= idx(st.r[1]),
					);
				});

				document.getElementById('step-counter').textContent =
					`${cur + 1} / ${SLIDES.length}`;
				document.getElementById('btn-prev').disabled = cur === 0;
				document.getElementById('btn-next').disabled =
					cur === SLIDES.length - 1;
			}

			function advance(delta) {
				cur = Math.max(0, Math.min(SLIDES.length - 1, cur + delta));
				render();
			}

			document.addEventListener('keydown', (e) => {
				if (e.key === 'ArrowRight') advance(1);
				if (e.key === 'ArrowLeft') advance(-1);
			});

			// Deep-link: #3 opens slide index 3
			const h = parseInt(location.hash.replace('#', ''), 10);
			if (!isNaN(h) && h >= 0 && h < SLIDES.length) cur = h;

			render();
		</script>
